# Ticko: self-hosted issue tracker.
#
#   1. Create a .env file next to this one:
#        echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" > .env
#   2. Start:
#        docker compose up -d
#   3. Open http://localhost:3000
#
# Every setting is documented in .env.example.
name: ticko

services:
  ticko:
    image: ghcr.io/kevinbrt/ticko:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:3000"
    environment:
      TICKO_URL: ${TICKO_URL:-http://localhost:3000}
      TICKO_DATABASE_URL: postgres://ticko:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ticko
      TICKO_TRUST_PROXY: ${TICKO_TRUST_PROXY:-false}
      TICKO_LOG_LEVEL: ${TICKO_LOG_LEVEL:-info}
    volumes:
      - ticko-data:/data
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Already running PostgreSQL 16 or newer? Remove this service and point TICKO_DATABASE_URL at it.
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ticko
    volumes:
      - ticko-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticko -d ticko"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  ticko-data:
  ticko-db:
