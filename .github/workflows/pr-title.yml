name: PR title

# Pull requests are squash-merged: the title becomes the commit message, so it must follow
# Conventional Commits for release-please to compute versions and the changelog.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check title
        env:
          # Passed through the environment, never interpolated into the script (injection-safe).
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(issues): add labels'"
            exit 1
          fi
