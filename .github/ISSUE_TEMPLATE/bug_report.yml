name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security issue? Do not open a public issue:** see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Toppo version
      description: Image tag you run, e.g. 0.1.0 or edge.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, how Toppo is deployed (Docker Compose, Kubernetes…), PostgreSQL version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server logs (`docker compose logs toppo`). Remove any secret first.
      render: shell
